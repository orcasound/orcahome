name: Static site

# Builds the static export (next.config.js `output: 'export'`) and attaches it
# to the run as a downloadable artifact. Preview it locally with
# `npx serve <unzipped folder>`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The Sanity project ID and dataset are public (see .env.example); the build
# reads published content only, so it needs no token.
env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: tncpl9l7
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: '2024-01-01'

jobs:
  artifact:
    name: Build artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: out/
          retention-days: 14
